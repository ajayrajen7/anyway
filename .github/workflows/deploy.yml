# Builds the single deployable image (Dockerfile: frontend + backend
# embedded into one binary — see server/internal/webapp) and pushes it to
# GitHub's own container registry, then tells Render to pull and run the
# new image. Runs on GitHub's own runners deliberately: the Claude Code
# session that built this deploy pipeline cannot reach either Fly.io or
# Render's APIs (session network is allowlisted, confirmed against a plain
# https://example.com request too) — see memory.md. This also happens to be
# better practice than a human's ad-hoc CLI deploy: repeatable and logged.
#
# The image is pushed PRIVATE, not public: it embeds ANYWAY_API_TOKEN inside
# the built frontend's JS bundle (architecture.md §B1's single static bearer
# token), so anyone who could pull a public image could extract it without
# even knowing the deployed URL. Render needs a registry credential (a
# GitHub PAT with read:packages) to pull a private ghcr.io image — see
# README.md "Deploying" for the one-time dashboard setup this requires.
#
# One-time setup before the first run (see README.md "Deploying"):
#   Repo secrets (Settings → Secrets and variables → Actions → Secrets):
#     ANYWAY_API_TOKEN      — the app's own single static bearer token (any
#                             random string you generate) — baked into the
#                             frontend build AND set as Render's runtime
#                             secret, so both must come from this one value
#     RENDER_DEPLOY_HOOK_URL — from the Render service's Settings → Deploy Hook
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            ANYWAY_API_TOKEN=${{ secrets.ANYWAY_API_TOKEN }}

      - name: Trigger Render deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL isn't set yet — image pushed to $IMAGE:latest, but no deploy was triggered. Set the secret once the Render service exists, then re-run this workflow."
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
